# Include inside the {$DOMAIN} site block (Caddy in Docker).
# Proxies /learning to the hub on the host. Do NOT use handle_path (it strips the prefix).
redir /learning /learning/ 308
handle /learning/* {
	reverse_proxy host.docker.internal:3119
}
